name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Python 3.14 package checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Source: https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Source: https://github.com/actions/setup-python/releases/tag/v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.4'
          check-latest: false

      - name: Show Python version
        run: python --version

      - name: Compile package and evaluation code
        run: python -B -m compileall -q skills evals

      - name: Validate JSON metadata
        run: >-
          python -B -c "import json; from pathlib import Path; [json.loads(path.read_text(encoding='utf-8')) for path in Path('evals').rglob('*.json')]; [json.loads(path.read_text(encoding='utf-8')) for path in Path('skills').rglob('*.json')]; [json.loads(path.read_text(encoding='utf-8')) for path in Path('.').glob('compatibility-*.json')]; print('JSON metadata valid')"

      - name: Run policy v2, reporter v3 and artifact suite
        run: python -B -m unittest discover -s evals -p "test_*.py"
